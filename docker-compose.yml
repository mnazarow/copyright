# Корректор: echo 'KORREKTOR_ADMIN_PASSWORD=Ваш-пароль-2026' > .env && docker compose up -d --build
# → http://сервер:8080, логин admin.
services:
  korrektor:
    build:
      context: .
      args:
        WITH_OCR: "0"        # 1 — распознавание сканов (Tesseract)
        WITH_OFFICE: "1"     # 1 — прием документов Word (LibreOffice)
        # сборка для вывода версии при сборке из git (в дистрибутиве уже есть app/BUILD):
        #   KORREKTOR_BUILD="$(git log -1 --format='%h %cs')" docker compose up -d --build
        KORREKTOR_BUILD: "${KORREKTOR_BUILD:-}"
    image: korrektor:latest
    restart: unless-stopped
    init: true               # «сборщик» дочерних процессов: LibreOffice, завершенный по таймауту, не остается зомби
    ports:
      - "8080:8080"
    environment:
      # пароль администратора берется из файла .env рядом (KORREKTOR_ADMIN_PASSWORD=...), без него запуск отменяется
      KORREKTOR_ADMIN_PASSWORD: "${KORREKTOR_ADMIN_PASSWORD:?Задайте KORREKTOR_ADMIN_PASSWORD в файле .env}"
      # адреса обратных прокси, которым доверяется X-Forwarded-For. По умолчанию — никому снаружи: иначе через
      # шлюз Docker заголовок можно подделать и обойти блокировку подбора пароля. Если перед Корректором стоит
      # nginx/Traefik в контейнере — впишите его адрес, например: "127.0.0.1,::1,172.18.0.5"; если nginx стоит на
      # самом сервере (вне Docker) — адрес шлюза сети Docker, обычно "127.0.0.1,::1,172.17.0.1" (узнать:
      # docker network inspect bridge), и закройте порт 8080 снаружи брандмауэром
      KORREKTOR_TRUSTED_PROXIES: "127.0.0.1,::1"
      # часовой пояс: от него зависят «час» отправки сводок, напоминаний, копий и время в журнале
      TZ: "${TZ:-Europe/Moscow}"
      # KORREKTOR_SECRET: ""   # если не задан — создается случайный в /data/.secret
    volumes:
      - korrektor-data:/data
      - korrektor-backups:/var/backups/korrektor   # резервные копии по расписанию (Настройки → Система)
  # Локальный LanguageTool (по желанию): в настройках укажите http://languagetool:8010
  # languagetool:
  #   image: erikvl87/languagetool
  #   restart: unless-stopped

volumes:
  korrektor-data:
  korrektor-backups:
