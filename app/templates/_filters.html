<form class="afilters" id="afilters" onsubmit="return false">
  {% if page == 'trends' %}
  <div class="seg" data-name="gran" title="Шаг группировки по времени">
    <button type="button" data-v="day">День</button><button type="button" data-v="week">Неделя</button><button type="button" data-v="month">Месяц</button>
  </div>
  {% endif %}
  <div class="seg" data-name="period" title="Период по дате загрузки">
    {% if page != 'trends' %}<button type="button" data-v="7">7 дн.</button>{% endif %}
    <button type="button" data-v="30">30 дн.</button><button type="button" data-v="90">90 дн.</button>
    <button type="button" data-v="180">180 дн.</button><button type="button" data-v="365">Год</button>
    <button type="button" data-v="all">Все</button><button type="button" data-v="custom">Даты…</button>
  </div>
  <span class="custom-dates" hidden><input type="date" name="from"> — <input type="date" name="to"></span>
  <input type="text" name="q" placeholder="Документ…" title="Часть названия документа">
  <select name="family" title="Семейство: версии одного документа"><option value="">Все семейства</option></select>
  {% if page != 'trends' %}<select name="batch" title="Пакет загрузки"><option value="">Все пакеты</option></select>{% endif %}
  <select name="author" title="Автор документа"><option value="">Все авторы</option></select>
  <select name="department" title="Отдел"><option value="">Все отделы</option></select>
  <select name="doc_type" title="Тип документа"><option value="">Все виды документов</option></select>
  <select name="type"><option value="">Все типы</option></select>
  <select name="source"><option value="">Все источники</option></select>
  {% if page != 'trends' %}<select name="status"><option value="">Любой статус</option></select>{% endif %}
  <button type="button" class="btn small ghost" id="freset">Сбросить</button>
</form>
<div class="chips" id="chips"></div>
